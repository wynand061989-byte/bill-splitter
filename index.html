<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Group Bill Splitter</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#08111f;--card:#111827;--panel:#0d1727;--line:#304058;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#06101d,#0b1220);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:18px 14px 80px}
h1{margin:4px 0;font-size:30px}.sub{color:var(--muted);margin-bottom:18px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid #243043;border-radius:18px;padding:16px;margin:14px 0}
.title{font-size:20px;font-weight:900;margin-bottom:10px}.small{font-size:12px;color:var(--muted)}
input,select,button{font:inherit}
input,select{width:100%;background:#0f172a;color:white;border:1px solid var(--line);border-radius:12px;padding:12px}
button{border:0;border-radius:12px;padding:13px 14px;font-weight:850;cursor:pointer}
.primary{background:var(--green);color:#052e16}.secondary{background:#263244;color:white}.danger{background:#3b1d22;color:#fecaca}
.file{display:block;width:100%;margin:10px 0;color:#dbeafe}
.file::file-selector-button{border:0;border-radius:12px;padding:12px 14px;margin-right:10px;background:#263244;color:white;font-weight:800}
.photo{margin-top:12px;border:2px dashed var(--line);border-radius:16px;min-height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b1525}
.photo img{width:100%;max-height:520px;object-fit:contain}.placeholder{text-align:center;color:var(--muted);padding:24px}
.notice{background:#0f2138;border:1px solid #294765;border-radius:14px;padding:12px;color:#cbd5e1;margin-top:10px}
.good{border-color:#2b6f47;color:#bbf7d0}.hidden{display:none!important}
.editRow{display:grid;grid-template-columns:1fr 100px 80px auto;gap:8px;align-items:center;margin:9px 0}
.progress{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0b1525;border:1px solid #24334a;border-radius:14px;padding:12px}
.badge{padding:6px 10px;border-radius:999px;background:#182235;border:1px solid #2d3a4e;color:#cbd5e1;font-size:12px}
.item{background:var(--panel);border:1px solid #2a394e;border-radius:14px;padding:13px;margin:10px 0}
.itemHead{display:flex;justify-content:space-between;gap:10px}.name{font-weight:900}.price{color:#86efac;font-weight:900}
.totalbox{background:#0b1525;border:1px solid #24334a;border-radius:14px;padding:14px}.totalbox div{display:flex;justify-content:space-between;padding:5px 0}.grand{font-size:22px;font-weight:950}
.summaryRow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #283447}.amount{color:#86efac;font-size:18px;font-weight:950}
@media(max-width:560px){.editRow{grid-template-columns:1fr 85px 70px}.editRow button{grid-column:1/-1;width:100%}}
</style>
</head>
<body>
<div class="app">
<h1>🧾 Group Bill Splitter</h1>
<div class="sub">Upload the receipt, review the detected items, then pass the phone around.</div>

<section id="setup" class="page active">
  <div class="card">
    <div class="title">1. Upload the bill</div>
    <input id="photoInput" class="file" type="file" accept="image/*">
    <div class="photo">
      <div id="placeholder" class="placeholder">No bill uploaded yet</div>
      <img id="preview" class="hidden" alt="Receipt preview">
    </div>
    <div id="uploadStatus" class="notice hidden"></div>
  </div>

  <div class="card">
    <div class="title">2. Number of people</div>
    <input id="peopleCount" type="number" min="1" step="1" inputmode="numeric" placeholder="How many people?">
  </div>

  <button id="confirmSetup" class="primary" style="width:100%">Confirm Bill & Continue</button>
</section>

<section id="review" class="page">
  <div class="card">
    <div class="title">Review detected items</div>
    <div id="scanStatus" class="notice">Reading receipt…</div>
    <div id="reviewItems"></div>
    <button id="addManual" class="secondary" style="width:100%;margin-top:10px">+ Add missing item</button>
  </div>
  <button id="startPeople" class="primary" style="width:100%">Start Person 1</button>
</section>

<section id="person" class="page">
  <div class="card">
    <div class="progress">
      <div><div class="small">Current turn</div><div id="turnTitle" style="font-size:22px;font-weight:950"></div></div>
      <span id="turnBadge" class="badge"></span>
    </div>
  </div>

  <div class="card">
    <div class="title">Your name</div>
    <input id="personName" placeholder="Enter your name">
  </div>

  <div class="card">
    <div class="title">What did you consume?</div>
    <select id="itemDropdown"></select>
    <input id="consumeQty" type="number" min="1" step="1" value="1" inputmode="numeric" style="margin-top:10px">
    <button id="addSelection" class="secondary" style="width:100%;margin-top:10px">Add Item</button>
    <div id="selectedList"></div>
  </div>

  <button id="submitPerson" class="primary" style="width:100%">Submit My Items</button>
</section>

<section id="result" class="page">
  <div class="card">
    <div class="title">Your total</div>
    <div class="totalbox">
      <div><span id="resultName"></span><strong id="resultSub"></strong></div>
      <div><span>10% tip</span><strong id="resultTip"></strong></div>
      <div class="grand"><span>Total</span><span id="resultTotal"></span></div>
    </div>
  </div>
  <button id="nextPerson" class="primary" style="width:100%">Pass to Next Person</button>
</section>

<section id="summary" class="page">
  <div class="card">
    <div class="title">Final summary</div>
    <div id="summaryList"></div>
  </div>
  <button id="reset" class="danger" style="width:100%">Start New Bill</button>
</section>
</div>

<script>
let receiptFile=null, previewUrl='', expectedPeople=0, items=[], people=[], activeSelections={};

const $=id=>document.getElementById(id);
const money=v=>'R'+Number(v||0).toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

$('photoInput').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  receiptFile=f;
  if(previewUrl)URL.revokeObjectURL(previewUrl);
  previewUrl=URL.createObjectURL(f);
  $('preview').src=previewUrl;
  $('preview').classList.remove('hidden');
  $('placeholder').classList.add('hidden');
  $('uploadStatus').textContent='✓ Bill uploaded successfully';
  $('uploadStatus').classList.remove('hidden');
  $('uploadStatus').classList.add('good');
});

function parseMoney(s){
  if(!s)return null;
  s=String(s).replace(/[^\d,.\-]/g,'');
  const c=s.lastIndexOf(','),d=s.lastIndexOf('.');
  if(c>d)s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/,/g,'');
  const n=parseFloat(s);
  return Number.isFinite(n)?n:null;
}

function parseReceipt(text){
  const lines=text.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  const ignore=/\b(total|subtotal|service charge|vat|tax|cash|change|card|receipt|date|employee|table|order|thank)\b/i;
  const out=[];
  let pending=null;
  const flush=()=>{if(pending){out.push(pending);pending=null}};

  for(const raw of lines){
    const line=raw.trim();
    const q=line.match(/^\s*(\d{1,2})\s*(?:@|x|X|0)\s*(\d{1,5}[.,]\d{2})\s*$/);
    if(q&&pending){
      pending.qty=Math.max(1,parseInt(q[1],10)||1);
      const unit=parseMoney(q[2]);
      if(unit!==null)pending.unit=unit;
      flush();
      continue;
    }

    if(ignore.test(line)){flush();continue}

    const m=line.match(/^(.+?)\s+(?:R\s*)?(\d{1,6}[.,]\d{2})\s*$/i);
    if(m){
      const name=m[1].trim();
      const price=parseMoney(m[2]);
      if(name.length>=2&&/[A-Za-z]/.test(name)&&price>0){
        flush();
        pending={name,qty:1,unit:price};
        continue;
      }
    }

    if(pending)flush();
  }
  flush();
  return out;
}

function renderReview(){
  const el=$('reviewItems');
  if(!items.length){
    el.innerHTML='<div class="small" style="padding:12px 0">No items detected. Add them manually below.</div>';
    return;
  }
  el.innerHTML=items.map((x,i)=>`<div class="editRow">
    <input value="${esc(x.name)}" onchange="items[${i}].name=this.value">
    <input type="number" step="0.01" value="${Number(x.unit).toFixed(2)}" onchange="items[${i}].unit=+this.value">
    <input type="number" min="1" value="${x.qty}" onchange="items[${i}].qty=Math.max(1,+this.value||1)">
    <button class="danger" onclick="items.splice(${i},1);renderReview()">Delete</button>
  </div>`).join('');
}

$('confirmSetup').addEventListener('click',async()=>{
  expectedPeople=parseInt($('peopleCount').value,10);
  if(!receiptFile)return alert('Please upload the receipt first.');
  if(!Number.isInteger(expectedPeople)||expectedPeople<1)return alert('Enter the number of people.');

  showPage('review');
  $('scanStatus').textContent='Reading receipt…';

  try{
    const r=await Tesseract.recognize(receiptFile,'eng',{
      logger:m=>{
        if(m.status==='recognizing text')$('scanStatus').textContent='Reading receipt… '+Math.round((m.progress||0)*100)+'%';
      }
    });
    items=parseReceipt(r.data.text||'');
    $('scanStatus').textContent=items.length?'✓ Receipt read. Review the items below.':'No clear items were detected. Add/correct them manually below.';
    $('scanStatus').classList.toggle('good',items.length>0);
    renderReview();
  }catch(e){
    items=[];
    $('scanStatus').textContent='Automatic reading failed. You can still add the receipt items manually below.';
    renderReview();
  }
});

$('addManual').addEventListener('click',()=>{
  items.push({name:'Item',qty:1,unit:0});
  renderReview();
});

$('startPeople').addEventListener('click',()=>{
  if(!items.length)return alert('Add at least one bill item.');
  startPerson();
});

function claimedQty(index){
  return people.reduce((sum,p)=>sum+Number((p.selections||{})[index]||0),0);
}
function remainingQty(index){
  return Math.max(0,items[index].qty-claimedQty(index));
}

function startPerson(){
  activeSelections={};
  $('personName').value='';
  $('turnTitle').textContent='Person '+(people.length+1);
  $('turnBadge').textContent=(people.length+1)+' of '+expectedPeople;
  renderDropdown();
  renderSelected();
  showPage('person');
}

function renderDropdown(){
  const available=items.map((x,i)=>({x,i,rem:remainingQty(i)})).filter(o=>o.rem>0);
  $('itemDropdown').innerHTML='<option value="">Select an item…</option>'+available.map(o=>
    `<option value="${o.i}">${esc(o.x.name)} — ${money(o.x.unit)} — ${o.rem} left</option>`
  ).join('');
  $('consumeQty').value='1';
}

$('addSelection').addEventListener('click',()=>{
  const i=parseInt($('itemDropdown').value,10);
  if(!Number.isInteger(i))return alert('Select an item first.');
  let q=parseInt($('consumeQty').value,10);
  if(!Number.isInteger(q)||q<1)return alert('Enter a valid quantity.');
  const current=Number(activeSelections[i]||0);
  const max=remainingQty(i);
  if(current+q>max)return alert('Only '+max+' remain.');
  activeSelections[i]=current+q;
  renderSelected();
});

function renderSelected(){
  const entries=Object.entries(activeSelections).filter(([,q])=>Number(q)>0);
  $('selectedList').innerHTML=entries.length?entries.map(([i,q])=>{
    const item=items[Number(i)];
    return `<div class="item"><div class="itemHead"><div><div class="name">${esc(item.name)}</div><div class="small">${q} × ${money(item.unit)}</div></div><div class="price">${money(q*item.unit)}</div></div></div>`;
  }).join(''):'<div class="small" style="padding:12px 0">No items selected yet.</div>';
}

$('submitPerson').addEventListener('click',()=>{
  const name=$('personName').value.trim();
  if(!name)return alert('Enter your name.');
  const entries=Object.entries(activeSelections).filter(([,q])=>Number(q)>0);
  if(!entries.length)return alert('Add at least one item.');

  let sub=0,selections={};
  entries.forEach(([i,q])=>{
    selections[i]=Number(q);
    sub+=items[Number(i)].unit*Number(q);
  });

  const tip=sub*0.10,total=sub+tip;
  people.push({name,selections,sub,tip,total});

  $('resultName').textContent=name;
  $('resultSub').textContent=money(sub);
  $('resultTip').textContent=money(tip);
  $('resultTotal').textContent=money(total);

  const done=people.length>=expectedPeople||items.every((_,i)=>remainingQty(i)===0);
  $('nextPerson').textContent=done?'Show Final Summary':'Pass to Next Person';
  showPage('result');
});

$('nextPerson').addEventListener('click',()=>{
  const done=people.length>=expectedPeople||items.every((_,i)=>remainingQty(i)===0);
  if(done){
    renderSummary();
    showPage('summary');
  }else startPerson();
});

function renderSummary(){
  const rows=people.map(p=>`<div class="summaryRow"><div><strong>${esc(p.name)}</strong><div class="small">${money(p.sub)} + ${money(p.tip)} tip</div></div><div class="amount">${money(p.total)}</div></div>`).join('');
  const sub=people.reduce((s,p)=>s+p.sub,0),tip=people.reduce((s,p)=>s+p.tip,0),total=people.reduce((s,p)=>s+p.total,0);
  $('summaryList').innerHTML=rows+`<div class="totalbox" style="margin-top:12px"><div><span>Items</span><strong>${money(sub)}</strong></div><div><span>10% tip</span><strong>${money(tip)}</strong></div><div class="grand"><span>Total</span><span>${money(total)}</span></div></div>`;
}

$('reset').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
